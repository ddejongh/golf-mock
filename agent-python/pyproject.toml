[project]
name = "venuepulse-agent"
version = "0.1.0"
description = "VenuePulse AI copilot agent: Claude tool-calling loop behind an internal SSE API."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13",
    "fastapi>=0.143",
    "httpx>=0.28",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/venuepulse_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "BLE", "TRY"]
# Errors here carry per-call messages by design (see errors.py).
ignore = ["TRY003"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
